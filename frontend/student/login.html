<!DOCTYPE html> 

<html lang="en"> 

<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 


<title>Student Login - School Admission Portal</title> 

<link rel="stylesheet" href="../css/style.css"> 

</head> 

<body> 


<header> 
    <nav> 
        <div class="logo"> 
            <h2>Govt High School, Chikkabellikatti</h2> 
        </div> 

        <ul class="nav-links"> 
            <li> 
                <a href="../index.html">Home</a> 
            </li> 

            <li> 
                <a href="login.html">Student Login</a> 
            </li> 
        </ul> 
    </nav> 
</header> 


<main> 

    <section class="login-section"> 

        <div class="login-box"> 

            <h1>Student Login</h1> 

            <p> 
                Login to access your admission portal. 
            </p> 

            <form id="studentLoginForm"> 

             <div class="form-group">
    <label for="studentUsername">Username</label>
    <input
        type="text"
        id="studentUsername"
        name="username"
        placeholder="Enter username"
        required
    >
</div>  


                <div class="form-group"> 
                    <label for="studentPassword"> 
                        Password 
                    </label> 

                    <input 
                        type="password" 
                        id="studentPassword" 
                        name="password" 
                        placeholder="Enter your password" 
                        required 
                    > 
                </div> 


                <button type="submit" class="btn"> 
                    Login 
                </button> 

            </form> 


            <p class="login-link"> 
                Don't have an account? 
                <a href="register.html">Register</a> 
            </p> 

        </div> 

    </section> 

</main> 


<footer> 

    <p> 
        &copy; 2026 Govt High School, Chikkabellikatti. 
        All Rights Reserved. 
    </p> 

</footer> 


<script src="../js/script.js"></script> 


</body> 

</html>
