<!DOCTYPE html> 

<html lang="en"> 

<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 


<title>Student Registration - School Admission Portal</title> 

<link rel="stylesheet" href="../css/style.css"> 


</head> 

<body> 


<header> 
    <nav> 

        <div class="logo"> 
            <h2>Govt High School, Chikkabellikatti</h2> 
        </div> 

        <ul class="nav-links"> 
            <li> 
                <a href="../index.html">Home</a> 
            </li> 

            <li> 
                <a href="login.html">Student Login</a> 
            </li> 
        </ul> 

    </nav> 
</header> 


<main> 

    <section class="login-section"> 

        <div class="login-box"> 

            <h1>Student Registration</h1> 

            <p> 
                Create your account to apply for admission. 
            </p> 


            <form id="studentRegisterForm"> 

                <div class="form-group"> 

                    <label for="studentName"> 
                        Full Name 
                    </label> 

                    <input 
                        type="text" 
                        id="studentName" 
                        name="name" 
                        placeholder="Enter your full name" 
                        required 
                    > 

                </div> 


                <div class="form-group"> 

                    <label for="studentUsername"> 
                        Username
                    </label> 

                    <input 
                        type="text" 
                        id="studentUsername" 
                        name="username" 
                        placeholder="Enter your username" 
                        required 
                    > 

                </div> 


                <div class="form-group"> 

                    <label for="studentPassword"> 
                        Password 
                    </label> 

                    <input 
                        type="password" 
                        id="studentPassword" 
                        name="password" 
                        placeholder="Create a password" 
                        required 
                    > 

                </div> 


                <div class="form-group"> 

                    <label for="confirmPassword"> 
                        Confirm Password 
                    </label> 

                    <input 
                        type="password" 
                        id="confirmPassword" 
                        name="confirmPassword" 
                        placeholder="Confirm your password" 
                        required 
                    > 

                </div> 


                <button type="submit" class="btn"> 
                    Register 
                </button> 

            </form> 


            <p class="login-link"> 

                Already have an account? 

                <a href="login.html"> 
                    Login 
                </a> 

            </p> 

        </div> 

    </section> 

</main> 


<footer> 

    <p> 
        &copy; 2026 Govt High School, Chikkabellikatti. 
        All Rights Reserved. 
    </p> 

</footer> 


<script src="../js/script.js"></script> 


</body> 

</html>
