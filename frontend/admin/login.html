<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>System Admin Login - School Admission Portal</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- ================= NAVIGATION ================= -->

    <header>

        <nav>

            <div class="logo">
                <h2>ABC Public School</h2>
            </div>

            <ul class="nav-links">

                <li>
                    <a href="../index.html">Home</a>
                </li>

            </ul>

        </nav>

    </header>


    <!-- ================= ADMIN LOGIN ================= -->

    <main>

        <section class="login-section">

            <div class="login-box">

                <h1>System Admin Login</h1>

                <p>
                    Authorized system administrators only.
                </p>


                <form id="adminLoginForm">

                    <div class="form-group">

                        <label for="adminUsername">
                            Username
                        </label>

                        <input
                            type="text"
                            id="adminUsername"
                            placeholder="Enter admin username"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="adminPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="adminPassword"
                            placeholder="Enter admin password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn"
                    >
                        Login
                    </button>

                </form>


                <p
                    id="adminLoginMessage"
                    class="login-message"
                ></p>

            </div>

        </section>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

        <p>
            &copy; 2026 School Admission Portal.
            All Rights Reserved.
        </p>

        <p>
            System Administration
        </p>

    </footer>


    <script src="../js/script.js"></script>

</body>

</html>
