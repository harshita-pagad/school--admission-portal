<!-- ================= TEACHER LOGIN ================= --> 

<main> 

    <section class="login-section"> 

        <div class="login-box"> 

            <h1>Teacher Login</h1> 

            <p> 
                Login to review student admission applications. 
            </p> 


            <form id="teacherLoginForm"> 

                <div class="form-group"> 

                    <label for="teacherUsername"> 
                        Username 
                    </label> 

                    <input 
                        type="text" 
                        id="teacherUsername" 
                        name="username" 
                        placeholder="Enter your username" 
                        required 
                    >      
                </div> 


                <div class="form-group"> 

                    <label for="teacherPassword"> 
                        Password 
                    </label> 

                    <input 
                        type="password" 
                        id="teacherPassword" 
                        name="password" 
                        placeholder="Enter your password" 
                        required 
                    > 

                </div> 


                <button type="submit" class="btn"> 
                    Login 
                </button> 

            </form> 

        </div> 

    </section> 

</main>
